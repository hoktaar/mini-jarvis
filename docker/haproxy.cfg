# Gefilterter Docker-Socket-Proxy: nur Status lesen und start/stop/restart.
global
    log stdout format raw local0
    maxconn 64

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    log global

frontend docker_api
    bind 127.0.0.1:2375
    http-request deny unless { method GET } || { method POST }
    acl is_inspect  path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$
    acl is_list     path_reg ^(/v[0-9.]+)?/containers/json$
    acl is_action   path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|restart)$
    http-request allow if { method GET } is_inspect
    http-request allow if { method GET } is_list
    http-request allow if { method POST } is_action
    http-request deny
    default_backend docker_sock

backend docker_sock
    server docker /var/run/docker.sock
