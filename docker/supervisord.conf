[program:ollama]
command=/usr/local/bin/ollama serve
user=ollama-svc
environment=OLLAMA_MODELS="/models/ollama",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_KEEP_ALIVE="10m",HOME="/models/ollama"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:searxng]
command=/opt/searxng-venv/bin/python -m searx.webapp
environment=SEARXNG_SETTINGS_PATH="/etc/searxng/settings.yml"
user=jarvis
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:docker-proxy]
command=/usr/sbin/haproxy -W -db -f /etc/haproxy/haproxy.cfg
user=proxy-docker
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:runner]
command=/opt/venv/bin/python -m jarvis.runner.server --socket /run/jarvis/runner.sock --scripts-file /config/scripts.yaml --scripts-root /scripts
user=runner
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=30

[program:jarvis-core]
command=/opt/venv/bin/python -m jarvis.main
user=jarvis
environment=HOME="/opt/jarvis",HF_HOME="/models/hf",JARVIS_CONFIG_DIR="/config",JARVIS_DATA_DIR="/data"
directory=/opt/jarvis
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=40

[program:init-models]
command=/opt/jarvis/init-models.sh
user=root
environment=OLLAMA_HOST="127.0.0.1:11434",HF_HOME="/models/hf"
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=50
