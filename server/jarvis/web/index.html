<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a33">
  <title>Jarvis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1>Jarvis</h1>
      <nav><a href="admin.html" class="link">Verwaltung</a> <button id="settings-btn" class="ghost" aria-label="Gerät einrichten">Gerät</button></nav>
    </header>

    <section class="core" aria-live="polite">
      <div id="ring" class="ring" data-state="idle" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p id="state" class="state">Bereit</p>
    </section>

    <ol id="log" class="log"></ol>

    <form id="composer" class="composer" autocomplete="off">
      <button id="talk" type="button" class="talk" aria-pressed="false">Sprechen</button>
      <input id="input" type="text" placeholder="Oder schreib Jarvis etwas" aria-label="Nachricht an Jarvis">
      <button type="submit" class="ghost">Senden</button>
    </form>

    <dialog id="settings">
      <form method="dialog" class="settings">
        <h2>Gerät verbinden</h2>
        <p>Lege in der Geräteverwaltung ein Gerät vom Typ <em>pwa</em> an und trage hier sein Token ein.</p>
        <label>Geräte-Token <input id="token" type="password" required></label>
        <menu><button value="cancel" class="ghost">Abbrechen</button><button id="save" value="save">Speichern</button></menu>
      </form>
    </dialog>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
