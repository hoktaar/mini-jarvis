[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-jarvis"
version = "0.3.0"
description = "Lokaler Sprachassistent auf Basis von Pipecat"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[websocket,silero,mcp]==1.12.*",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6",
  "pydantic>=2.6",
  "httpx>=0.27",
  "dateparser>=1.2",
  "feedparser>=6",
  "numpy>=1.26",
  "loguru>=0.7",
  "cryptography>=42",
  "segno>=1.6",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "psutil>=5.9",
]

[project.optional-dependencies]
gpu = [
  "pipecat-ai[whisper,piper]==1.12.*",
  "sentence-transformers>=3",
]
cloud = ["pipecat-ai[anthropic,openai,jev]==1.12.*"]
chat = ["matrix-nio>=0.24", "python-telegram-bot>=21", "soundfile>=0.12", "soxr>=0.3"]
extras = ["caldav>=1.3"]
selftest = ["soundfile>=0.12", "soxr>=0.3", "websockets>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "radicale>=3.2"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["web/*", "web/**/*", "data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE"]
