[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-jarvis"
version = "0.2.0"
description = "Lokaler Sprachassistent auf Basis von Pipecat"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[websocket,silero,mcp]==1.12.*",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6",
  "pydantic>=2.6",
  "httpx>=0.27",
  "dateparser>=1.2",
  "feedparser>=6",
]

[project.optional-dependencies]
gpu = [
  "pipecat-ai[whisper,piper]==1.12.*",
  "openwakeword>=0.6",
  "sentence-transformers>=3",
]
cloud = ["pipecat-ai[anthropic,openai,jev]==1.12.*"]
chat = ["matrix-nio>=0.24", "python-telegram-bot>=21"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
