name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/pyproject.toml }
      - run: pip install -e "server[dev,cloud,chat,extras]"
      - name: Lint
        run: cd server && ruff check .
      - name: Tests
        run: cd server && pytest -q
      - name: Router-Auswertung
        run: cd server && python -m jarvis.router.eval --trigram --min 0.88

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/cyd/platformio.ini') }}
      - run: pip install "platformio==6.2.0"
      - name: Bauen (ILI9341 und ST7789)
        working-directory: firmware/cyd
        run: pio run -e cyd -e cyd-st7789
      - name: Paket für Web-Flasher und OTA
        working-directory: firmware/cyd
        run: python tools/package.py --out dist
      - name: Bildschirme auf dem PC rendern
        working-directory: firmware/cyd/tools/preview
        run: |
          git clone --depth 1 --branch 1.2.7 https://github.com/lovyan03/LovyanGFX.git /tmp/LovyanGFX
          ./build.sh /tmp/LovyanGFX
          mkdir -p out && ./preview out
      - uses: actions/upload-artifact@v7
        with:
          name: cyd-firmware
          path: firmware/cyd/dist

  image:
    needs: [test, firmware]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - name: Speicherplatz freimachen (CUDA-Image ist groß)
        uses: jlumbroso/free-disk-space@v2.0.0
        with: { preinstalled-runtimes: true, android: true, dotnet: true, haskell: true, large-packages: true, swap-storage: true }
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mini-jarvis
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: mini-jarvis:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Rauchtest ohne GPU
        run: pip install pyyaml && sh docker/smoke-test.sh mini-jarvis:test
      - name: Veröffentlichen
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
