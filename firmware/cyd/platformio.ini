; Mini-Jarvis Firmware für den ESP32-2432S028 (CYD)
; Bauen:   pio run -e cyd             Flashen per USB:  pio run -e cyd -t upload
; Paket für die Jarvis-Verwaltung (Web-Flasher + OTA):  python tools/package.py --out dist
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv   ; 2 × 1,9 MB App für OTA-Updates
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    links2004/WebSockets@2.6.1
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -DBOARD_CYD=1
    -DCORE_DEBUG_LEVEL=2

[env:cyd]

; Variante mit ST7789-Panel (CYD2USB: USB-C + Micro-USB)
[env:cyd-st7789]
build_flags =
    ${env.build_flags}
    -DPANEL_ST7789=1
