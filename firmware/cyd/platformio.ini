; Mini-Jarvis Firmware für den ESP32-2432S028 (CYD)
; Bauen:  pio run -e cyd          Flashen: pio run -e cyd -t upload
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; mehr Platz für App + OTA
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    links2004/WebSockets@^2.6.1
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

[env:cyd]
board = esp32dev
build_flags =
    -DBOARD_CYD=1
    -DCORE_DEBUG_LEVEL=2

; Variante mit ST7789-Panel (manche 2-USB-Boards)
[env:cyd-st7789]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DPANEL_ST7789=1
